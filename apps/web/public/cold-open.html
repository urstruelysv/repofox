<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepoFox — Cold Open</title>
<style>
  :root {
    --accent: #5B4FE9;
    --bg: #05050a;
    --text: #f5f5f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .scale-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  .stage {
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: top left;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(91, 79, 233, 0.06) 0%,
      rgba(0, 0, 0, 0) 60%
    );
    pointer-events: none;
  }

  .card {
    position: relative;
    max-width: 1280px;
    width: 100%;
    padding: 0 80px;
    text-align: left;
  }

  .type-text {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.32;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .line {
    display: block;
  }

  .line.accent .char {
    color: var(--accent);
  }

  .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(6px);
    animation: charIn 0.32s ease-out forwards;
  }

  @keyframes charIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cursor {
    display: inline-block;
    width: 5px;
    height: 0.82em;
    background: var(--accent);
    margin-left: 3px;
    border-radius: 1px;
    vertical-align: -0.08em;
    animation: blink 1s ease-in-out infinite;
  }

  .cursor.solid {
    animation: none;
    opacity: 1;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  .mark {
    position: absolute;
    bottom: -90px;
    left: 80px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  .mark.show {
    opacity: 1;
    transform: translateY(0);
  }

  .mark-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--accent);
  }

  .mark-word {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #9a97b0;
  }

  .mark-word b {
    color: var(--text);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="scale-wrap" id="scaleWrap">
  <div class="stage" id="stage">
    <div class="card">
      <div class="type-text" id="typeText" aria-live="polite">
        <span class="line" id="line1"></span>
        <span class="line accent" id="line2" hidden></span>
      </div>
      
    </div>
  </div>
</div>

<script>
  const stage = document.getElementById("stage");
  const line1El = document.getElementById("line1");
  const line2El = document.getElementById("line2");
  const mark = document.getElementById("mark");

  const line1 = "AI changed how code gets written.";
  const line2 = "Nobody's fixed how it gets shipped.";
  const charDelay = 34;

  // Cursor lives inside the active line so it tracks the typewriter.
  const cursor = document.createElement("span");
  cursor.className = "cursor solid";
  cursor.id = "cursor";
  cursor.setAttribute("aria-hidden", "true");

  function fitStage() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${scale})`;
    stage.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
    stage.style.top = `${(window.innerHeight - 1080 * scale) / 2}px`;
  }

  window.addEventListener("resize", fitStage);
  fitStage();

  function appendChar(container, ch) {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = ch === " " ? "\u00A0" : ch;
    // Insert before the cursor so the caret stays at the end of the line.
    container.insertBefore(span, cursor);
  }

  function typeLine(text, container) {
    return new Promise((resolve) => {
      container.appendChild(cursor);
      cursor.classList.add("solid");

      let i = 0;
      function next() {
        if (i < text.length) {
          appendChar(container, text[i]);
          i += 1;
          setTimeout(next, charDelay);
          return;
        }
        resolve();
      }
      next();
    });
  }

  async function start() {
    await typeLine(line1, line1El);

    // Brief pause before the second line
    await new Promise((r) => setTimeout(r, 180));

    line2El.hidden = false;
    await typeLine(line2, line2El);

    cursor.classList.remove("solid");
    setTimeout(() => mark.classList.add("show"), 250);
  }

  window.addEventListener("load", () => {
    setTimeout(start, 300);
  });
</script>

</body>
</html>
